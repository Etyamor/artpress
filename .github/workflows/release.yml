name: Release

# Manual "button": Actions tab → "Release" → Run workflow.
#
#   patch / minor → runs CI, bumps the version (+ optional changelog), builds
#                   and verifies the zip, then commits "bump version to X.Y.Z"
#                   to main and publishes GitHub Release vX.Y.Z (zip +
#                   info.json). Sites pick the update up from that release.
#   none          → only builds the zip of the current version as a workflow
#                   artifact (for testing); nothing is committed or released.
#
# The bump is pushed only after the zip has been built and verified, so a
# failed build never leaves a bumped version without a release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch: 1.1.3 → 1.1.4   |   minor: 1.1.3 → 1.2.0   |   none: build zip only, no release'
        type: choice
        options:
          - patch
          - minor
          - none
        default: patch
      changelog:
        description: 'Changelog for readme.txt, changes separated by ";" (e.g. "Added category layouts; Fixed share links"). Leave empty to skip.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: ${{ inputs.bump == 'none' && 'Build zip' || format('Release ({0})', inputs.bump) }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE: ${{ inputs.bump != 'none' }}
    steps:
      - name: Only release from main
        if: env.RELEASE == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run releases from the main branch (selected: ${GITHUB_REF}). Use bump = none to build a zip from another branch."
          exit 1

      # Default ref = the commit CI just tested.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Inputs go through env vars, never inline into the script, so quotes or
      # $(...) in the changelog text can't be executed by the shell.
      - name: Bump version
        if: env.RELEASE == 'true'
        env:
          BUMP: ${{ inputs.bump }}
          CHANGELOG: ${{ inputs.changelog }}
        run: node scripts/bump-version.mjs "$BUMP" --changelog "$CHANGELOG"

      - name: Read theme version
        id: meta
        run: |
          version="$(grep -m1 'Version:' style.css | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=artpress-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Fail if release already exists
        if: env.RELEASE == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      - name: Show version changes
        if: env.RELEASE == 'true'
        run: git --no-pager diff

      - name: Build zip
        run: make zip

      - name: Verify zip contents
        env:
          ZIP: ${{ steps.meta.outputs.zip }}
        run: |
          unzip -l "$ZIP"
          unzip -l "$ZIP" | grep -q 'artpress/style.css'
          unzip -l "$ZIP" | grep -q 'artpress/dist/.vite/manifest.json'
          ! unzip -l "$ZIP" | grep -qE 'artpress/(node_modules|vendor|tests|resources)/'

      # Update manifest read by inc/updater.php on every site.
      - name: Generate info.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/release-info.mjs "$GITHUB_REPOSITORY" > info.json
          cat info.json
          test "$(node -p 'require("./info.json").version')" = "$VERSION"

      # archive: false uploads the theme zip as-is. Without it the artifact is
      # wrapped in another zip, which WordPress can't install.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.meta.outputs.zip }}
          archive: false
          if-no-files-found: error

      - name: Commit and push version bump
        if: env.RELEASE == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css readme.txt
          entries="$(node -p 'require("./info.json").changelog.map(e => "* " + e).join("\n")')"
          if [ -n "$entries" ]; then
            git commit -m "bump version to $VERSION" -m "$entries"
          else
            git commit -m "bump version to $VERSION"
          fi
          git push origin HEAD:main

      - name: Publish GitHub Release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        run: |
          gh release create "v$VERSION" "$ZIP" info.json \
            --target "$(git rev-parse HEAD)" \
            --title "ArtPress $VERSION" \
            --generate-notes \
            --latest

      # Download exactly what WordPress sites will download.
      - name: Verify published update
        if: env.RELEASE == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p /tmp/check && cd /tmp/check
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/info.json" -o info.json
          test "$(node -p 'require("./info.json").version')" = "$VERSION"
          curl -fsSL --retry 5 --retry-all-errors "$(node -p 'require("./info.json").package')" -o theme.zip
          unzip -l theme.zip | grep -q ' artpress/style.css$'
          unzip -p theme.zip artpress/style.css | grep -q "^Version: $VERSION"

      - name: Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        run: |
          {
            if [ "$RELEASE" = "true" ]; then
              echo "### ArtPress $VERSION released"
              echo
              entries="$(node -p 'require("./info.json").changelog.map(e => "* " + e).join("\n")')"
              if [ -n "$entries" ]; then
                echo "$entries"
                echo
              fi
              echo "WordPress sites will offer the update within ~12 hours (Dashboard → Updates → *Check again* to see it immediately)."
            else
              echo "### Built \`$ZIP\` (no release)"
              echo
              echo "Download it from the artifacts below. Nothing was committed or published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
